<html lang="en">
<head>
<meta charset="UTF-8">

<title>Schola Domestica · Year 6 Planner</title>
<style>
  :root{
    --ink:#2b2620; --paper:#faf7f2; --card:#ffffff; --line:#e5ddd0;
    --accent:#7a5c3e; --accent2:#42604a; --gold:#b08d4f; --soft:#f0e9dd;
    --done:#9aa08f; --red:#8c4a3f;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:Georgia,'Times New Roman',serif; background:var(--paper); color:var(--ink); line-height:1.45;}
  header{background:var(--card); border-bottom:2px solid var(--gold); padding:14px 22px; display:flex; flex-wrap:wrap; gap:12px; align-items:baseline;}
  header h1{font-size:1.25rem; letter-spacing:.03em;}
  header h1 span{color:var(--accent); font-style:italic;}
  header .sub{font-size:.85rem; color:#7c6f5d;}
  nav{margin-left:auto; display:flex; gap:6px; align-items:center;}
  button, select, input{font-family:inherit; font-size:.9rem;}
  .btn{border:1px solid var(--line); background:var(--card); padding:6px 14px; border-radius:6px; cursor:pointer; color:var(--ink);}
  .btn:hover{background:var(--soft);}
  .btn.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .btn.small{padding:3px 9px; font-size:.8rem;}
  main{max-width:1080px; margin:0 auto; padding:18px 22px 80px;}
  .toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:6px 0 18px;}
  .toolbar .title{font-size:1.15rem; font-weight:bold; margin:0 8px;}
  .muted{color:#8a7d69; font-size:.85rem;}
  /* month */
  .cal{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .cal .dow{font-size:.75rem; text-transform:uppercase; letter-spacing:.08em; color:#8a7d69; text-align:center; padding:4px 0;}
  .cell{background:var(--card); border:1px solid var(--line); border-radius:8px; min-height:92px; padding:6px; cursor:pointer; position:relative; overflow:hidden;}
  .cell:hover{border-color:var(--gold);}
  .cell.off{opacity:.38; cursor:default;}
  .cell .dnum{font-size:.8rem; color:#8a7d69;}
  .cell.today .dnum{background:var(--accent2); color:#fff; border-radius:10px; padding:1px 7px;}
  .cell .wktag{position:absolute; top:6px; right:6px; font-size:.65rem; color:var(--gold); font-style:italic;}
  .chip{display:block; font-size:.68rem; background:var(--soft); border-radius:4px; padding:1px 5px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .chip.custom{background:#e4ead9;}
  .chip.done{text-decoration:line-through; color:var(--done);}
  .more{font-size:.65rem; color:var(--accent); margin-top:2px;}
  /* week & day */
  .daycol{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:12px;}
  .daycol h3{font-size:.95rem; border-bottom:1px solid var(--line); padding-bottom:5px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:baseline;}
  .daycol h3 .muted{font-weight:normal;}
  .wkgrid{display:grid; grid-template-columns:repeat(5,1fr); gap:10px;}
  @media(max-width:900px){.wkgrid{grid-template-columns:1fr;}}
  .item{display:flex; gap:8px; align-items:flex-start; padding:5px 4px; border-radius:6px; font-size:.85rem;}
  .item:hover{background:var(--soft);}
  .item input[type=checkbox]{margin-top:3px; accent-color:var(--accent2); cursor:pointer;}
  .item .cat{font-size:.62rem; text-transform:uppercase; letter-spacing:.05em; color:#fff; background:var(--accent); border-radius:3px; padding:1px 5px; margin-right:4px; white-space:nowrap;}
  .item.custom .cat{background:var(--accent2);}
  .item.done .txt{text-decoration:line-through; color:var(--done);}
  .item .txt{flex:1;}
  .item .tools{visibility:hidden; display:flex; gap:4px;}
  .item:hover .tools{visibility:visible;}
  .item .tools button{border:none; background:none; cursor:pointer; color:#8a7d69; font-size:.8rem;}
  .item .tools button:hover{color:var(--red);}
  .fixtures{background:var(--soft); border-radius:8px; padding:8px 10px; margin-bottom:12px; font-size:.82rem;}
  .fixtures b{color:var(--accent);}
  .banner{background:#f3ead8; border:1px solid var(--gold); border-radius:8px; padding:8px 12px; margin-bottom:14px; font-size:.85rem;}
  .examweek{background:#eef1e8; border:1px dashed var(--accent2); border-radius:8px; padding:10px 14px; margin-bottom:14px; font-style:italic;}
  /* modal */
  .overlay{position:fixed; inset:0; background:rgba(43,38,32,.45); display:none; align-items:center; justify-content:center; z-index:50;}
  .overlay.show{display:flex;}
  .modal{background:var(--card); border-radius:12px; padding:22px; width:min(440px,92vw); box-shadow:0 12px 40px rgba(0,0,0,.25);}
  .modal h3{margin-bottom:14px; color:var(--accent);}
  .modal label{display:block; font-size:.8rem; margin:10px 0 3px; color:#7c6f5d;}
  .modal input, .modal select, .modal textarea{width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:6px; background:var(--paper);}
  .modal textarea{min-height:60px; resize:vertical;}
  .modal .row{display:flex; gap:10px; justify-content:flex-end; margin-top:18px;}
  .danger{color:var(--red);}
  .settingsgrid{display:grid; grid-template-columns:1fr 1fr; gap:0 14px;}
  footer{text-align:center; font-size:.75rem; color:#a2947e; padding:20px; font-style:italic;}
  .progressbar{height:6px; background:var(--soft); border-radius:3px; overflow:hidden; margin-top:4px;}
  .progressbar div{height:100%; background:var(--accent2);}
</style>
</head>

/* ================= STATE ================= */
const LS='sd-y6-planner';
let S=JSON.parse(localStorage.getItem(LS)||'{}');
/* per-student state (migrate old flat y6 data) */
if(!S.checks||!S.checks.y6){S.checks={y6:S.checks||{},y3:{}};}
if(!S.moves||!S.moves.y6){S.moves={y6:S.moves||{},y3:{}};}
S.custom=(S.custom||[]).map(c=>({st:'y6',...c}));
S.student=S.student||'y6';
const STU={
 y6:{label:'Year 6',WEEKS,TERMS,DAILY,WEEKLY,FREE:FREE_READS},
 y3:{label:'Year 3',WEEKS:WEEKS3,TERMS:TERMS3,DAILY:DAILY3,WEEKLY:WEEKLY3,FREE:FREE3}
};
function stu(){return STU[S.student];}
function CK(){return S.checks[S.student];}
function MV(){return S.moves[S.student];}
S.t1=S.t1||'2026-08-17'; S.t2=S.t2||'2026-11-09'; S.t3=S.t3||'2027-02-22';
/* break weeks (Mondays): Thanksgiving, Nativity x2, Holy Week, Bright Week */
S.breaks=S.breaks||['2026-11-23','2026-12-21','2026-12-28','2027-04-26','2027-05-03'];
S.breakNames=S.breakNames||{'2026-11-23':'Thanksgiving','2026-12-21':'Nativity','2026-12-28':'Nativity','2027-04-26':'Holy Week','2027-05-03':'Bright Week'};
S.dayOffs=S.dayOffs||[]; /* single-day breaks: date is skipped/shown as off but week numbering is unaffected */
S.view=S.view||'week'; S.cursor=S.cursor||todayStr();
function save(){localStorage.setItem(LS,JSON.stringify(S));}
function todayStr(){return fmt(new Date());}
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parse(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function nextMonday(){const d=new Date();d.setDate(d.getDate()+((8-d.getDay())%7||7));return fmt(d);}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return fmt(d);}
function monOf(s){const d=parse(s);const off=(d.getDay()+6)%7;d.setDate(d.getDate()-off);return fmt(d);}

/* term starts: default consecutive (T2 = T1+12wk, T3 = T2+12wk) */
function termStart(n){ if(n===1)return S.t1; if(n===2)return S.t2||addDays(S.t1,84); return S.t3||addDays(S.t2||addDays(S.t1,84),84); }
function isBreak(mondayStr){return S.breaks.includes(mondayStr);}
function isDayOff(dateStr){return S.dayOffs.includes(dateStr);}
function toggleDayOff(dateStr){
  const i=S.dayOffs.indexOf(dateStr);
  if(i>=0)S.dayOffs.splice(i,1); else {S.dayOffs.push(dateStr); S.dayOffs.sort();}
  save();render();
}
/* map date -> {week, day} (Mon-Fri only; break weeks skipped) */
function schoolWeekOf(dateStr){
  for(let t=3;t>=1;t--){
    const st=termStart(t);
    if(dateStr>=st){
      const mon=monOf(dateStr);
      if(isBreak(mon))return null;
      const rawWks=Math.round((parse(mon)-parse(st))/6048e5);
      let brk=0;
      for(const b of S.breaks)if(b>=st&&b<mon)brk++;
      const wk=rawWks-brk+1+(t-1)*12;
      const dow=(parse(dateStr).getDay()+6)%7;
      if(wk<=t*12 && wk>=1+(t-1)*12 && dow<5) return {week:wk, day:dow, term:t};
      return null;
    }
  }
  return null;
}
function weekStartDate(wk){
  const t=Math.ceil(wk/12);
  let mon=termStart(t), n=wk-(t-1)*12;
  while(true){
    if(!isBreak(mon)){n--; if(n===0)return mon;}
    mon=addDays(mon,7);
  }
}

/* seeded items for a given date */
function seededFor(dateStr){
  const swk=schoolWeekOf(dateStr); if(!swk)return[];
  const items=stu().WEEKS[swk.week]||[];
  return items.map((it,i)=>{
    const id='w'+swk.week+'i'+i;
    const day=(MV()[id]!==undefined)?MV()[id]:i%5;
    return {id,cat:it[0],text:it[1],day,week:swk.week};
  }).filter(it=>it.day===swk.day);
}
function customFor(dateStr){return S.custom.map((c,i)=>({...c,idx:i})).filter(c=>c.date===dateStr&&(c.st||'y6')===S.student);}

/* ================= RENDER ================= */
const app=document.getElementById('app');
const MO=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOWS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

function setView(v){S.view=v;save();render();}
document.getElementById('st-y6').onclick=()=>{S.student='y6';save();render();};
document.getElementById('st-y3').onclick=()=>{S.student='y3';save();render();};
document.getElementById('v-month').onclick=()=>setView('month');
document.getElementById('v-week').onclick=()=>setView('week');
document.getElementById('v-day').onclick=()=>setView('day');
document.getElementById('btn-settings').onclick=showSettings;

function render(){
  ['y6','y3'].forEach(k=>document.getElementById('st-'+k).classList.toggle('active',S.student===k));
  ['month','week','day'].forEach(v=>document.getElementById('v-'+v).classList.toggle('active',S.view===v));
  if(S.view==='month')renderMonth(); else if(S.view==='week')renderWeek(); else renderDay();
}

function toolbar(title,onPrev,onNext,extra=''){
  return `<div class="toolbar">
    <button class="btn" id="tprev">‹</button>
    <span class="title">${title}</span>
    <button class="btn" id="tnext">›</button>
    <button class="btn small" id="ttoday">Today</button>
    ${extra}
    <span style="margin-left:auto"><button class="btn small" id="taddx">+ Add lesson</button></span>
  </div>`;
}
function bindToolbar(onPrev,onNext,addDate){
  document.getElementById('tprev').onclick=onPrev;
  document.getElementById('tnext').onclick=onNext;
  document.getElementById('ttoday').onclick=()=>{S.cursor=todayStr();save();render();};
  document.getElementById('taddx').onclick=()=>showAdd(addDate||S.cursor);
}

/* ---- MONTH ---- */
function renderMonth(){
  const c=parse(S.cursor), y=c.getFullYear(), m=c.getMonth();
  const first=new Date(y,m,1); const startOff=(first.getDay()+6)%7;
  const days=new Date(y,m+1,0).getDate();
  let html=toolbar(MO[m]+' '+y);
  html+='<div class="cal">'+DOWS.map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<startOff;i++)html+='<div></div>';
  for(let d=1;d<=days;d++){
    const ds=fmt(new Date(y,m,d));
    const swk=schoolWeekOf(ds);
    const seed=seededFor(ds), cust=customFor(ds);
    const all=[...seed.map(s=>({t:s.text,done:CK()[s.id],cls:''})),...cust.map(cu=>({t:cu.title,done:cu.done,cls:'custom'}))];
    const isWknd=[5,6].includes((parse(ds).getDay()+6)%7);
    const off=isDayOff(ds);
    const shown=all.slice(0,3).map(a=>`<span class="chip ${a.cls} ${a.done?'done':''}">${esc(a.t)}</span>`).join('');
    html+=`<div class="cell ${(isWknd&&!all.length)||off?'off':''} ${ds===todayStr()?'today':''}" data-d="${ds}">
      <span class="dnum">${d}</span>${swk?`<span class="wktag">wk ${swk.week}</span>`:(isBreak(monOf(ds))&&(parse(ds).getDay()+6)%7<5?`<span class="wktag">${esc(S.breakNames[monOf(ds)]||'break')}</span>`:'')}
      ${off?'<span class="wktag" style="color:var(--red)">day off</span>':''}
      ${shown}${all.length>3?`<div class="more">+${all.length-3} more…</div>`:''}
    </div>`;
  }
  html+='</div>';
  app.innerHTML=html;
  bindToolbar(()=>{S.cursor=fmt(new Date(y,m-1,15));save();render();},()=>{S.cursor=fmt(new Date(y,m+1,15));save();render();});
  app.querySelectorAll('.cell[data-d]').forEach(el=>el.onclick=()=>{S.cursor=el.dataset.d;setView('day');});
}

/* ---- WEEK ---- */
function renderWeek(){
  const mon=monOf(S.cursor);
  const swk=schoolWeekOf(mon)||schoolWeekOf(addDays(mon,1));
  const term=swk?Math.ceil(swk.week/12):null;
  let title=`${stu().label} — `+(swk?`Week ${swk.week} <span class="muted">(Term ${term})</span>`:(isBreak(mon)?`${esc(S.breakNames[mon]||'Break')} <span class="muted">— no school</span>`:'Outside school year'));
  let html=toolbar(title+` <span class="muted">${mon} – ${addDays(mon,4)}</span>`);
  if(swk){
    const t=stu().TERMS[term-1];
    const total=(stu().WEEKS[swk.week]||[]).length;
    const done=(stu().WEEKS[swk.week]||[]).filter((_,i)=>CK()['w'+swk.week+'i'+i]).length;
    html+=`<div class="fixtures"><b>Every day:</b> ${stu().DAILY.join(' · ')}<br>
      <b>Weekly:</b> ${stu().WEEKLY.join(' · ')}<br>
      <b>Poetry this term:</b> ${t.poetry} &nbsp; <b>Geography concepts:</b> ${t.geo}
      <div class="progressbar"><div style="width:${total?Math.round(done/total*100):0}%"></div></div></div>`;
    if([12,24,36].includes(swk.week))html+=`<div class="examweek">End of Term ${term}: optional Exam Week follows — see amblesideonline.org/exams.</div>`;
    if(swk.week===1)html+=`<div class="banner">${esc(stu().FREE)}</div>`;
  }
  html+='<div class="wkgrid">';
  for(let i=0;i<5;i++){
    const ds=addDays(mon,i);
    html+=dayColumn(ds,DOWS[i]);
  }
  html+='</div>';
  app.innerHTML=html;
  bindToolbar(()=>{S.cursor=addDays(S.cursor,-7);save();render();},()=>{S.cursor=addDays(S.cursor,7);save();render();},mon);
  bindItems();
}

/* ---- DAY ---- */
function renderDay(){
  const ds=S.cursor;
  const d=parse(ds);
  const swk=schoolWeekOf(ds);
  let html=toolbar(`${stu().label} — ${DOWS[(d.getDay()+6)%7]}, ${MO[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`+(swk?` <span class="muted">· wk ${swk.week}, Term ${Math.ceil(swk.week/12)}</span>`:''));
  if(swk){
    const t=stu().TERMS[Math.ceil(swk.week/12)-1];
    html+=`<div class="fixtures"><b>Daily:</b> ${stu().DAILY.join(' · ')}<br><b>Poetry:</b> ${t.poetry}</div>`;
  }
  html+=dayColumn(ds,null,true);
  app.innerHTML=html;
  bindToolbar(()=>{S.cursor=addDays(ds,-1);save();render();},()=>{S.cursor=addDays(ds,1);save();render();},ds);
  bindItems();
}

function dayColumn(ds,label,big){
  const seed=seededFor(ds), cust=customFor(ds);
  const off=isDayOff(ds);
  let h=`<div class="daycol" ${big?'style="min-height:220px"':''}>
    <h3><span>${label?label+' ':''}<span class="muted">${ds.slice(5)}</span></span>
    <button class="btn small" data-toggleoff="${ds}" title="Mark this day off">${off?'✓ Day off':'Day off'}</button></h3>`;
  if(off)h+='<div class="banner">No school — day off.</div>';
  if(!seed.length&&!cust.length)h+='<div class="muted" style="font-size:.8rem">No readings assigned.</div>';
  seed.forEach(s=>{
    h+=`<div class="item ${CK()[s.id]?'done':''}">
      <input type="checkbox" data-chk="${s.id}" ${CK()[s.id]?'checked':''}>
      <span class="txt"><span class="cat">${CATS[s.cat]||s.cat}</span>${esc(s.text)}</span>
      <span class="tools"><button title="Move to another weekday" data-mv="${s.id}" data-wk="${s.week}">⇄</button></span>
    </div>`;
  });
  cust.forEach(c=>{
    h+=`<div class="item custom ${c.done?'done':''}">
      <input type="checkbox" data-cchk="${c.idx}" ${c.done?'checked':''}>
      <span class="txt"><span class="cat">${esc(c.subject||'Lesson')}</span>${esc(c.title)}${c.notes?` <span class="muted">— ${esc(c.notes)}</span>`:''}</span>
      <span class="tools"><button data-ce="${c.idx}" title="Edit">✎</button><button class="danger" data-cx="${c.idx}" title="Delete">✕</button></span>
    </div>`;
  });
  h+=`<div style="margin-top:6px"><button class="btn small" data-addday="${ds}">+ add</button></div></div>`;
  return h;
}

function bindItems(){
  app.querySelectorAll('[data-chk]').forEach(el=>el.onchange=()=>{CK()[el.dataset.chk]=el.checked;save();render();});
  app.querySelectorAll('[data-cchk]').forEach(el=>el.onchange=()=>{S.custom[el.dataset.cchk].done=el.checked;save();render();});
  app.querySelectorAll('[data-cx]').forEach(el=>el.onclick=()=>{if(confirm('Delete this lesson?')){S.custom.splice(el.dataset.cx,1);save();render();}});
  app.querySelectorAll('[data-ce]').forEach(el=>el.onclick=()=>showAdd(null,el.dataset.ce));
  app.querySelectorAll('[data-mv]').forEach(el=>el.onclick=()=>{
    const curDay=MV()[el.dataset.mv]??null;
    const v=prompt('Move to which weekday? 1=Mon 2=Tue 3=Wed 4=Thu 5=Fri',curDay!==null?curDay+1:'');
    if(v&&/^[1-5]$/.test(v.trim())){MV()[el.dataset.mv]=Number(v.trim())-1;save();render();}
  });
  app.querySelectorAll('[data-addday]').forEach(el=>el.onclick=()=>showAdd(el.dataset.addday));
  app.querySelectorAll('[data-toggleoff]').forEach(el=>el.onclick=()=>toggleDayOff(el.dataset.toggleoff));
}

const overlay=document.getElementById('overlay'), modal=document.getElementById('modal');
function close(){overlay.classList.remove('show');}
overlay.onclick=e=>{if(e.target===overlay)close();};
function showAdd(date,editIdx){
  const c=editIdx!=null?S.custom[editIdx]:{date:date||S.cursor,subject:'',title:'',notes:''};
  modal.innerHTML=`<h3>${editIdx!=null?'Edit':'Add'} lesson</h3>
    <label>Date</label><input type="date" id="f-date" value="${c.date}">
    <label>Subject label</label><input id="f-sub" placeholder="e.g. Music, Catechism, Co-op" value="${esc(c.subject)}">
    <label>Lesson</label><input id="f-title" placeholder="What to do or read" value="${esc(c.title)}">
    <label>Notes (optional)</label><textarea id="f-notes">${esc(c.notes||'')}</textarea>
    <label><input type="checkbox" id="f-rep" style="width:auto"> repeat weekly on this weekday for the rest of the term</label>
    <div class="row"><button class="btn" id="f-cancel">Cancel</button><button class="btn active" id="f-save">Save</button></div>`;
  overlay.classList.add('show');
  document.getElementById('f-cancel').onclick=close;
  document.getElementById('f-save').onclick=()=>{
    const nc={st:c.st||S.student,date:document.getElementById('f-date').value,subject:document.getElementById('f-sub').value,
      title:document.getElementById('f-title').value,notes:document.getElementById('f-notes').value,done:c.done||false};
    if(!nc.title){alert('Please enter a lesson.');return;}
    if(editIdx!=null)S.custom[editIdx]=nc;
    else{
      S.custom.push(nc);
      if(document.getElementById('f-rep').checked){
        const swk=schoolWeekOf(nc.date);
        if(swk){const endWk=Math.ceil(swk.week/12)*12;
          for(let w=swk.week+1;w<=endWk;w++)S.custom.push({...nc,date:addDays(weekStartDate(w),swk.day)});}
      }
    }
    save();close();render();
  };
}

    <textarea id="s-breaks" style="min-height:110px">${S.breaks.map(b=>b+(S.breakNames[b]?', '+S.breakNames[b]:'')).join('\n')}</textarea>
    <label>Single day-offs — one date per line (doesn't shift week numbering; also toggleable with the "Day off" button on any day)</label>
    <textarea id="s-dayoffs" style="min-height:70px">${S.dayOffs.join('\n')}</textarea>
    <p class="muted" style="margin-top:10px">Each term is 12 school weeks, Monday–Friday. Break weeks are skipped and the schedule shifts automatically. Progress is stored in this browser (localStorage).</p>
    <div class="row">
      <button class="btn danger" id="s-reset">Reset all progress</button>
      <button class="btn" id="s-cancel">Cancel</button><button class="btn active" id="s-save">Save</button></div>`;
  overlay.classList.add('show');
  document.getElementById('s-cancel').onclick=close;
  document.getElementById('s-reset').onclick=()=>{if(confirm('Clear all checkmarks and custom lessons (both students)?')){S.checks={y6:{},y3:{}};S.custom=[];S.moves={y6:{},y3:{}};save();close();render();}};
  document.getElementById('s-save').onclick=()=>{
    const t1=document.getElementById('s-t1').value,t2=document.getElementById('s-t2').value,t3=document.getElementById('s-t3').value;
    if(t1)S.t1=monOf(t1); if(t2)S.t2=monOf(t2); if(t3)S.t3=monOf(t3);
    S.breaks=[];S.breakNames={};
    document.getElementById('s-breaks').value.split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{
      const[dt,...nm]=l.split(',');const m2=monOf(dt.trim());
      if(/^\d{4}-\d{2}-\d{2}$/.test(dt.trim())){S.breaks.push(m2);if(nm.length)S.breakNames[m2]=nm.join(',').trim();}
    });
    S.breaks.sort();
    S.dayOffs=document.getElementById('s-dayoffs').value.split('\n').map(l=>l.trim()).filter(l=>/^\d{4}-\d{2}-\d{2}$/.test(l));
    S.dayOffs.sort();
    save();close();render();
  };
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
render();
</script>
</body>
</html>
